name: build-check
on:
  pull_request:
  push:
    branches: [main]
permissions:
  contents: read
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      - name: Build dist/ and check the prompt character limit
        run: bash scripts/build.sh
      - name: Fail if dist/ is out of date with prompt/ and knowledge/
        run: |
          git status --porcelain -- dist/
          test -z "$(git status --porcelain -- dist/)"
