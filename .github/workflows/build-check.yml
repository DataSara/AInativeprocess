name: build-check
on:
  pull_request:
  push:
    branches: [main]
permissions:
  contents: read
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      - name: Build dist/ and check the prompt character limit
        run: bash scripts/build.sh
      - name: Test the report checker against hostile inputs
        run: python3 -I -m unittest discover -s tests
      - name: Check example reports against the template's safety rules
        run: python3 -I scripts/check-report.py examples/*/report.html
      - name: Fail if dist/ is out of date with prompt/ and knowledge/
        run: |
          git status --porcelain -- dist/
          test -z "$(git status --porcelain -- dist/)"
